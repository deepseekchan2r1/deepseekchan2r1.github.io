      :root {
        color-scheme: light dark;
        --desk-1: #efe7d7;
        --desk-2: #e2d5bd;
        --ink: #3d2c1e;
        --ink-soft: #7a6753;
        --accent: #a03d2a;
        --paper: #faf4e6;
        --paper-line: #d9cbaa;
        --msg-ink: #503418;
        --label-ink: #a08b62;
        --postmark-ink: rgba(28, 52, 112, 0.85);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --desk-1: #241f1a;
          --desk-2: #171310;
          --ink: #ecdfc9;
          --ink-soft: #b3a189;
          --accent: #e08a72;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: "Hiragino Sans GB", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: radial-gradient(120% 90% at 50% 0%, var(--desk-1) 0%, var(--desk-2) 78%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 16px 32px;
      }

      .note {
        margin: 0 0 18px;
        font-size: 13px;
        letter-spacing: 0.22em;
        color: var(--ink-soft);
        text-align: center;
      }

      /* ---------- 方版舞台：480×480 基准，窄屏等比缩放 ---------- */
      .stage {
        width: min(1126px, 100vw - 24px);
        min-width: 240px;
        perspective: 1600px;
        container-type: inline-size;
      }
      .ground-shadow {
        height: 22px;
        margin: 14px 10% 0;
        border-radius: 50%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(43, 30, 16, 0.42), rgba(43, 30, 16, 0) 70%);
        filter: blur(2px);
      }
      .stage.flipping .ground-shadow { animation: shadowPulse 0.8s ease; }
      @keyframes shadowPulse {
        0% { transform: scaleX(1); opacity: 1; }
        50% { transform: scaleX(0.72); opacity: 0.55; }
        100% { transform: scaleX(1); opacity: 1; }
      }

      .card {
        position: relative;
        width: 100%;
        aspect-ratio: 1126 / 1817;
        cursor: pointer;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      .card:focus-visible { filter: drop-shadow(0 0 0.55rem rgba(160, 61, 42, 0.55)); }
      .card-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.25, 0.72, 0.24, 1);
      }
      .card.flipped .card-inner { transform: rotateY(180deg); }

      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 18px 38px rgba(43, 30, 16, 0.30), 0 4px 10px rgba(43, 30, 16, 0.18);
      }
      .face .shade {
        position: absolute; inset: 0;
        background: #201409;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      .stage.flipping .face .shade { animation: shadePulse 0.8s ease; }
      @keyframes shadePulse {
        0% { opacity: 0; }
        50% { opacity: 0.22; }
        100% { opacity: 0; }
      }

      /* ---------- 正面：成品图 cover 铺满方版 ---------- */
      .face.front { background: #fff; }
      .face.front img {
        width: 100%; height: 100%;
        display: block;
        object-fit: cover;
        /* 成品图是竖版 2:3，方版 cover 时取中上段，保住人物与邮筒 */
        object-position: 50% 30%;
      }
      .flip-badge {
        position: absolute;
        right: 12px; bottom: 12px;
        z-index: 4;
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #f7efdd;
        background: rgba(43, 30, 16, 0.55);
        border-radius: 999px;
        padding: 5px 12px;
        pointer-events: none;
      }

      /* ---------- 背面（演示页定版排，方版适配） ---------- */
      .face.back {
        transform: rotateY(180deg);
        background:
          repeating-linear-gradient(0deg, rgba(120, 96, 58, 0.025) 0 2px, transparent 2px 5px),
          var(--paper);
        color: var(--msg-ink);
        display: flex;
        flex-direction: column;
        padding: 4.6cqw 4.6cqw 3.4cqw;
      }
      /* 顶部带：左邮编方格、右邮票区 */
      .back-top { display: flex; align-items: flex-start; }
      .postcode { display: flex; gap: 0.9cqw; flex: none; padding-top: 0.4cqw; }
      .postcode i {
        width: 3.4cqw; height: 4.3cqw;
        border: 1.4px solid rgba(160, 61, 42, 0.55);
        border-radius: 2px;
      }
      .stamp-zone { position: relative; height: 4.7cqw; flex: 1; min-width: 0; }
      .stamp {
        position: absolute;
        top: 0; right: 0;
        width: 19cqw; height: 19cqw;
        background: #fff;
        padding: 1cqw;
        transform: rotate(5deg);
        box-shadow: 0 2px 7px rgba(80, 52, 24, 0.28);
        outline: 1.6px dashed #d9cbaa;
        outline-offset: -4px;
      }
      .stamp img { width: 100%; height: 100%; display: block; object-fit: cover; }
      /* 暗蓝椭圆邮戳：轮廓贴字收紧，只留一点空，压住邮票一角 */
      .postmark {
        position: absolute;
        top: 10.6cqw; right: 16.6cqw;
        width: 26.5cqw; height: 16.6cqw;
        border: 2.2px solid var(--postmark-ink);
        border-radius: 50%;
        transform: rotate(-13deg);
        color: var(--postmark-ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.2cqw;
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      .postmark::before {
        content: "";
        position: absolute;
        inset: 1.1cqw;
        border: 1.2px solid var(--postmark-ink);
        border-radius: 50%;
      }
      .postmark .pm-from {
        font-family: "ZhenKai", "Kaiti SC", "STKaiti", serif;
        font-size: 3.1cqw;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        white-space: nowrap;
      }
      .postmark .pm-date {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 3.6cqw;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      /* 方格下留约一字高，依次排寄信人／收信人四行，行内小空隙统一 */
      .addr-lines {
        margin-top: 6.2cqw;
        display: flex;
        flex-direction: column;
        gap: 4.4cqw;
      }
      .addr-line { border-bottom: 1.4px solid var(--paper-line); position: relative; height: 5.4cqw; }
      .addr-line span {
        position: absolute;
        left: 0; top: -2.9cqw;
        font-size: 2.4cqw;
        letter-spacing: 0.3em;
        color: var(--label-ink);
      }
      .addr-line .fill {
        position: absolute;
        left: 0.4cqw; bottom: 0.7cqw;
        font-family: "ZhenKai", "Kaiti SC", "STKaiti", serif;
        font-weight: 400;
        font-size: 4cqw;
        letter-spacing: 0.05em;
        color: var(--msg-ink);
        white-space: nowrap;
      }
      .addr-line .fill-mail {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 3.1cqw;
        letter-spacing: 0.01em;
      }

      .message {
        font-family: "ZhenKai", "Kaiti SC", "STKaiti", serif;
        font-size: 3.8cqw;
        line-height: 1.95;
        letter-spacing: 0.03em;
        color: var(--msg-ink);
        margin: 5cqw 0 0;
      }
      .back-foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 2.5cqw;
        letter-spacing: 0.1em;
        color: var(--label-ink);
      }
      .back-foot .bf-title {
        font-family: "ZhenKai", "Kaiti SC", "STKaiti", serif;
        font-size: 3cqw;
      }

      .hint {
        margin: 16px 0 0;
        font-size: 13.5px;
        color: var(--ink-soft);
        letter-spacing: 0.08em;
        min-height: 1.5em;
        text-align: center;
      }
      .hint b { color: var(--accent); font-weight: 600; }

      /* ---------- 被 iframe 嵌入时（X 帖内 Player）：只剩卡片本身 ---------- */
      body.embed {
        padding: 0;
        min-height: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--paper);
        justify-content: center;
      }
      body.embed .note, body.embed .hint, body.embed .ground-shadow { display: none; }
      body.embed .stage {
        width: 100vmin;
        min-width: 0;
      }
      body.embed .face { border-radius: 0; box-shadow: none; }

      @media (prefers-reduced-motion: reduce) {
        .card-inner { transition: transform 0.01s linear; }
        .stage.flipping .ground-shadow, .stage.flipping .face .shade { animation: none; }
      }

            <p class="message">近来可好。自从上一封信寄出，我总惦记着你那边的天气。银杏落的时候，人就容易想把心事写下来。这张明信片是我新得的，画里的人像你，又不全是你。愿你读到这里的时候，窗边正好有风，茶还温着。等你的回信，不急。</p>
            <div class="back-foot">
              <span class="bf-title">『人偶信箱』第1封《投信之前》</span>

    </div>

    <p class="hint" id="hint">现在是<b>正面</b> · 点一下，翻到背面</p>

    <script>
      /* 被 iframe 嵌入时切换成纯卡片模式：无外边距、无滚动条 */
      if (window.self !== window.top) {
        document.body.classList.add("embed");
      }

      var stage = document.getElementById("stage");
      var card = document.getElementById("card");
      var hintEl = document.getElementById("hint");
      var flipped = false;

      function updateHint() {
        hintEl.innerHTML = flipped
          ? "现在是<b>背面</b> · 再点一下，翻回正面"
          : "现在是<b>正面</b> · 点一下，翻到背面";
        card.setAttribute("aria-pressed", flipped ? "true" : "false");
        card.setAttribute("aria-label", flipped ? "明信片背面，点击翻回正面" : "明信片正面，点击翻到背面");
      }

      function pulseFlipFx() {
        stage.classList.remove("flipping");
        void stage.offsetWidth;
        stage.classList.add("flipping");
        setTimeout(function () { stage.classList.remove("flipping"); }, 850);
      }

      function flip() {
        flipped = !flipped;
        card.classList.toggle("flipped", flipped);
        pulseFlipFx();
        updateHint();
      }

      card.addEventListener("click", flip);
      card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          flip();
        }
      });

      updateHint();
    </script>
  </body>
</html>
