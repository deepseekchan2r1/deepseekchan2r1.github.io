<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">

<title>X Player Card 实测页 3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: "Hiragino Sans","Noto Sans SC",sans-serif;
    background: linear-gradient(160deg,#141824,#232a3d 60%,#1b2130);
    display:flex; align-items:center; justify-content:center; min-height:100%;
    padding:10px; color:#2b2118;
  }
  .stage { width:min(96vw, 844px); }
  .card { position:relative; width:100%; aspect-ratio: 844/627; perspective:1400px; cursor:pointer; container-type: inline-size; }
  .inner { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.2,.7,.25,1); }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:10px; overflow:hidden; box-shadow:0 18px 44px rgba(0,0,0,.45); }
  .front img.photo { width:100%; height:100%; object-fit:cover; display:block; }
  .hint {
    position:absolute; left:50%; bottom:3cqw; transform:translateX(-50%);
    background:rgba(20,16,12,.55); color:#fdf6ec; font-size:3.4cqw; letter-spacing:.14em;
    padding:1.4cqw 3.4cqw; border-radius:999px; pointer-events:none; white-space:nowrap;
  }
  .back { transform: rotateY(180deg); background:#f7f1e3; padding:4cqw 5cqw; display:flex; flex-direction:column; }
  .back-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .postcode { display:flex; gap:1.2cqw; }
  .postcode i { width:4.6cqw; height:6cqw; border:.38cqw solid #b3543f; border-radius:.7cqw; display:block; }
  .stampzone { position:relative; width:15cqw; height:15cqw; flex:none; }
  .stampzone img { width:100%; height:100%; object-fit:contain; }
  .postmark {
    position:absolute; left:-8.5cqw; bottom:-1.5cqw; width:21cqw; height:9.6cqw;
    border:.5cqw solid rgba(28,52,112,.8); border-radius:50%; transform:rotate(-13deg);
    color:rgba(28,52,112,.85); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:2.15cqw; letter-spacing:.18em; line-height:1.5; pointer-events:none;
  }
  .addr { margin-top:4.5cqw; }
  .addr .row { display:flex; align-items:baseline; gap:2.4cqw; border-bottom:.35cqw solid #a5937a; padding:1.1cqw .4cqw .9cqw; margin-bottom:2.4cqw; }
  .addr .who { font-size:2.6cqw; color:#8a7457; letter-spacing:.22em; white-space:nowrap; }
  .addr .val { font-size:3.5cqw; letter-spacing:.04em; }
  .addr .val.small { font-size:2.9cqw; color:#4d4132; }
  .body-text { margin-top:1cqw; font-size:3.15cqw; line-height:1.95; color:#3a2f22; text-align:justify; }
  .rule { margin-top:auto; border-top:.55cqw solid #6d5b40; position:relative; height:1.6cqw; }
  .rule::after { content:""; position:absolute; left:0; right:0; top:.8cqw; border-top:.25cqw solid #6d5b40; }
  .caption-band { padding-top:1.8cqw; }
  .caption-band .t { font-size:2.8cqw; color:#5a4632; letter-spacing:.06em; margin-bottom:.7cqw; }
  .caption-band .c { font-size:3.6cqw; color:#40342a; }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card" role="button" aria-label="翻转明信片">
      <div class="inner">
        <div class="face front">
          <img class="photo" src="letter10.png" alt="『人偶信箱』第10封《不鲸云》">
          <div class="hint">点一下 · 翻到背面</div>
        </div>
        <div class="face back">
          <div class="back-top">
            <div class="postcode"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="stampzone">
              <img src="stamp.png" alt="火漆印章邮票">
              <div class="postmark"><span>人偶信箱</span><span>2026.11.09</span></div>
            </div>
          </div>
          <div class="addr">
            <div class="row"><span class="who">寄信人</span><span class="val">小肥鱼</span><span class="val small">eldia.coltd@gmail.com</span></div>
            <div class="row"><span class="who">收信人</span><span class="val">鲸鱼娘</span><span class="val small">deepseekchan2r1@muse.ai</span></div>
          </div>
          <p class="body-text">近来可好。自从上一封信寄出，我总惦记着你那边的天气。银杏落的时候，人就容易想把心事写下来。这张明信片是我新得的，画里的人像你，又不全是你。愿你读到这里的时候，窗边正好有风，茶还温着。等你的回信，不急。</p>
          <div class="rule"></div>
          <div class="caption-band">
            <div class="t">『人偶信箱』第10封《不鲸云》</div>
            <div class="c">看着白云娘的睡脸，鲸鱼娘把书页停在了指间。</div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
  document.getElementById('card').addEventListener('click', function(){ this.classList.toggle('flipped'); });
</script>
</body>
</html>
