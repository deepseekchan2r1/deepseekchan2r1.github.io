<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大家来找AI娘</title>
<meta name="description" content="AI娘找茬小游戏：闯关、道具、抽卡，全员集合！">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="找AI娘">
<meta name="app-version" content="v0.7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#101a2e;--panel:#1a2742;--panel2:#22335a;--ink:#eef2ff;--dim:#9fb0d8;--gold:#ffd94d;--red:#ff5252;--purple:#b388ff;--teal:#4dd0e1;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans SC","Segoe UI",sans-serif;height:100dvh;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
.screen{display:none;flex-direction:column;height:100%;min-height:0}
.screen.active{display:flex}
/* language screen */
#scr-lang{align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#scr-lang .logo{width:110px;height:110px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#scr-lang h1{font-size:26px;letter-spacing:1px}
#scr-lang p{color:var(--dim);font-size:14px}
.langbtn{width:min(320px,84vw);padding:16px;font-size:19px;border-radius:var(--radius);background:var(--panel2);border:1px solid #35508c}
.langbtn:active{transform:scale(.98)}
/* home */
#scr-home{position:relative;align-items:center;padding:20px 18px calc(16px + env(safe-area-inset-bottom));gap:14px;overflow-y:auto}
#scr-home .logo{width:96px;height:96px;border-radius:22px;margin-top:10px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#scr-home h1{font-size:27px}
#scr-home .sub{color:var(--dim);font-size:13.5px;text-align:center;line-height:1.55;max-width:340px}
.bestbox{background:var(--panel);border:1px solid #2c4472;border-radius:var(--radius);padding:10px 18px;font-size:14px;color:var(--dim);text-align:center;line-height:1.7}
.bestbox b{color:var(--gold);font-size:17px}
.bigbtn{width:min(320px,86vw);padding:15px;font-size:19px;font-weight:700;border-radius:var(--radius);background:linear-gradient(180deg,#ffb03a,#ff8a3d);color:#231303;box-shadow:0 6px 18px rgba(255,150,60,.35)}
.bigbtn:active{transform:scale(.98)}
.subbtn{width:min(320px,86vw);padding:12px;font-size:15.5px;border-radius:var(--radius);background:var(--panel2);border:1px solid #35508c}
#homehint{display:none;background:#2b2113;border:1px solid #8a6a1f;color:#ffd94d;border-radius:var(--radius);padding:10px 14px;font-size:13px;line-height:1.6;max-width:340px;text-align:center}
.langswitch{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;background:var(--panel2);border:1px solid #35508c;border-radius:999px;padding:6px 12px;font-size:13px;z-index:30}
/* game */
#hud{padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--panel);border-bottom:1px solid #2c4472;z-index:5}
#hudrow{display:flex;align-items:center;gap:8px;font-size:14px}
#hudrow .lv{font-weight:800;font-size:16px;white-space:nowrap}
#timewrap{flex:1;height:12px;background:#0a1120;border-radius:99px;overflow:hidden;border:1px solid #2c4472}
#timebar{height:100%;background:linear-gradient(90deg,#4dd0e1,#7be495);width:100%;transition:width .12s linear}
#timebar.low{background:linear-gradient(90deg,#ff5252,#ff9a3d)}
#timetext{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
#hudrow2{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px;color:var(--dim)}
#hudrow2 .score{color:var(--gold);font-weight:700}
.propbtn{margin-left:auto;display:flex;gap:6px}
.propbtn button{background:var(--panel2);border:1px solid #35508c;border-radius:999px;padding:5px 10px;font-size:13px;color:var(--ink)}
.propbtn button:disabled{opacity:.38}
.propbtn button b{color:var(--gold)}
#stages{flex:1;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#0a1120}
.stage + .stage{border-top:2px solid #2c4472}
.stage .tag{position:absolute;left:8px;top:6px;z-index:4;background:rgba(10,17,32,.72);color:var(--dim);font-size:11.5px;padding:3px 8px;border-radius:99px;pointer-events:none}
.zoom{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.fit{position:absolute}
.fit img{width:100%;height:100%;display:block;pointer-events:none}
.marks{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;border:3.5px solid var(--red);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 2px 10px rgba(0,0,0,.4);animation:pop .28s ease-out}
.mark.exposed{border-color:var(--purple)}
.mark.hintring{border:3px dashed var(--gold);animation:hintpulse 0.7s ease-in-out infinite alternate;box-shadow:none}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(1.7);opacity:.2}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes hintpulse{from{transform:translate(-50%,-50%) scale(.92);opacity:.65}to{transform:translate(-50%,-50%) scale(1.08);opacity:1}}
.missx{position:absolute;transform:translate(-50%,-50%);color:var(--red);font-size:30px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;animation:missfade .55s ease-out forwards;z-index:6}
@keyframes missfade{to{transform:translate(-50%,-90%);opacity:0}}
.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(6,10,20,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid #35508c;border-radius:18px;padding:20px;width:min(430px,94vw);max-height:92dvh;overflow-y:auto;text-align:center}
.card h2{font-size:21px;margin-bottom:8px}
.card .dim{color:var(--dim);font-size:13.5px;line-height:1.6}
#clearov{background:rgba(6,10,20,.45)}
#clearov .card{background:rgba(26,39,66,.95)}
#clearov .big{font-size:30px;font-weight:900;color:var(--gold)}
/* quiz */
.qopts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.qopts button{background:var(--panel2);border:1px solid #35508c;border-radius:12px;padding:12px;font-size:15.5px;text-align:left}
.qopts button.right{background:#1d4d2b;border-color:#3f9e57}
.qopts button.wrong{background:#5a1f1f;border-color:#a03d3d}
/* settlement */
#settle .bignum{display:flex;gap:14px;justify-content:center;margin:12px 0}
#settle .bignum div{background:var(--panel2);border-radius:14px;padding:12px 18px;min-width:118px}
#settle .bignum .n{font-size:31px;font-weight:900;color:var(--gold)}
#settle .bignum .l{font-size:12.5px;color:var(--dim);margin-top:2px}
.gacha{margin:10px auto 4px;width:190px;height:190px;perspective:800px}
.gachainner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.3,1.2)}
.gacha.flipped .gachainner{transform:rotateY(180deg)}
.gface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gback{background:linear-gradient(150deg,#22335a,#101a2e);border:2px solid #35508c;font-size:44px}
.gfront{transform:rotateY(180deg);background:#000}
.gfront img{width:100%;height:100%;object-fit:cover}
.gfront .rframe{position:absolute;inset:0;border:5px solid var(--gold);border-radius:16px;pointer-events:none}
.rar-N{border-color:#9fb0d8!important}.rar-R{border-color:#4dd0e1!important}.rar-SR{border-color:#b388ff!important}.rar-SSR{border-color:#ffd94d!important;box-shadow:0 0 22px rgba(255,217,77,.55)}
.glabel{font-size:14.5px;margin-top:8px;line-height:1.55}
.glabel .r{font-weight:900}
.setbtns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.setbtns button{padding:13px;border-radius:12px;font-size:16px;font-weight:700}
#btn-share{background:#000;border:1px solid #444;color:#fff}
#btn-share-card{background:#1d2c4d;border:1px solid #33507e;color:#dbe7ff}
#btn-again{background:linear-gradient(180deg,#ffb03a,#ff8a3d);color:#231303}
#btn-tocol{background:var(--panel2);border:1px solid #35508c}
#fromline{font-size:12px;color:var(--dim);line-height:1.7;margin-top:10px}
/* collection */
#scr-col{padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
#scr-col h2{font-size:20px;text-align:center}
#colprog{text-align:center;color:var(--dim);font-size:13.5px;margin:6px 0 12px}
#colgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.colitem{background:var(--panel);border-radius:12px;overflow:hidden;border:2px solid #2c4472;text-align:center}
.colitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.colitem .nm{font-size:12px;padding:5px 3px 1px;line-height:1.35}
.colitem .rr{font-size:11px;padding-bottom:6px;font-weight:800}
.colitem.unowned img{filter:grayscale(1) brightness(.42)}
.colitem .cnt{color:var(--gold);font-weight:800}
.magview{width:100%;height:32dvh;border-radius:12px;background-repeat:no-repeat;border:1px solid #35508c;background-color:#0a1120}
.propbtn button.armed{background:#8a6a1f;border-color:#ffd94d;color:#ffd94d}
#btn-install{width:min(320px,86vw);padding:13px;font-size:16.5px;font-weight:700;border-radius:var(--radius);background:#2b2113;border:1.5px solid var(--gold);color:var(--gold)}
.step{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid #35508c;border-radius:12px;padding:12px;margin-top:10px}
.step .ic{font-size:26px;line-height:1.15;flex:none;width:38px;text-align:center}
.step .tx{font-size:14.5px;line-height:1.55;padding-top:4px}
.step .tx b{color:var(--gold)}
#install-arrow{display:none;font-size:30px;margin-top:10px;animation:bob 0.8s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(9px)}}
#verwrap{position:absolute;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px}
#btn-update{background:var(--panel2);border:1px solid #35508c;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--dim)}
#ver{font-size:11px;color:var(--dim);opacity:.65}
#gate{position:fixed;inset:0;background:#0b1322;z-index:200;display:flex;align-items:center;justify-content:center;padding:22px}
#gate .gcard{width:min(92vw,380px);background:var(--panel);border:1px solid #2c4472;border-radius:18px;padding:26px 22px;text-align:center}
#gate h1{font-size:23px;margin:0 0 6px}
#gate .gsub{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:16px}
#gate input{width:100%;box-sizing:border-box;background:#0d1730;border:1px solid #35508c;border-radius:12px;color:var(--ink);font-size:17px;padding:12px 14px;text-align:center;letter-spacing:2px}
#gate button{width:100%;margin-top:12px;background:linear-gradient(180deg,#ffb03a,#ff8a3d);color:#231303;border:none;border-radius:12px;font-size:16.5px;font-weight:700;padding:12px}
#gate .gerr{color:var(--red);font-size:13.5px;min-height:20px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(20,30,55,.96);border:1px solid #35508c;color:var(--ink);padding:10px 18px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:.3s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- language -->
<div id="gate">
  <div class="gcard">
    <h1>《大家来找AI娘》</h1>
    <div class="gsub">测试中 · 暂未公开<br>Testing — not public yet<br>テスト中 · 未公開</div>
    <input id="gate-in" type="password" autocomplete="off" placeholder="口令 Passcode パスコード">
    <button id="gate-btn">进入 · Enter · 入る</button>
    <div class="gerr" id="gate-err"></div>
  </div>
</div>
<section id="scr-lang" class="screen">
  <img class="logo" src="icon-192.png" alt="">
  <h1>大家来找AI娘</h1>
  <p>Choose your language / 言語を選んでください</p>
  <button class="langbtn" data-lang="zh">简体中文</button>
  <button class="langbtn" data-lang="ja">日本語</button>
  <button class="langbtn" data-lang="en">English</button>
</section>

<!-- home -->
<section id="scr-home" class="screen">
  <button class="langswitch" id="langswitch-home">🌐</button>
  <img class="logo" src="icon-192.png" alt="">
  <h1 data-i18n="title">大家来找AI娘</h1>
  <p class="sub" data-i18n="homesub">上下两张图，只差几处。限时找完所有不同，闯得越深分越高！</p>
  <div class="bestbox" id="bestbox"></div>
  <button class="bigbtn" id="btn-start" data-i18n="start">开始闯关</button>
  <button id="btn-install" style="display:none" data-i18n="install">📲 装到主屏幕</button>
  <button class="subbtn" id="btn-col" data-i18n="collection">卡片图鉴</button>
  <div id="verwrap"><button id="btn-update" data-i18n="updatebtn">更新</button><span id="ver">v0.3</span></div>
  <p class="sub" data-i18n="propsnote">开局自带「提示」×1。每 5 关有答题关，答对掉道具；单关零误点也有机会掉落。</p>
</section>

<!-- game -->
<section id="scr-game" class="screen">
  <div id="hud">
    <div id="hudrow">
      <span class="lv" id="hud-lv"></span>
      <div id="timewrap"><div id="timebar"></div></div>
      <span id="timetext">0:00</span>
    </div>
    <div id="hudrow2">
      <span id="hud-found"></span>
      <span class="score" id="hud-score"></span>
      <span class="propbtn">
        <button id="prop-hint"></button>
        <button id="prop-time"></button>
        <button id="prop-expose"></button>
        <button id="prop-mag"></button>
      </span>
    </div>
  </div>
  <div id="stages">
    <div class="stage" id="stageA"><span class="tag" data-i18n="orig">原图</span><div class="zoom"><div class="fit"><img alt=""><div class="marks"></div></div></div></div>
    <div class="stage" id="stageB"><span class="tag" data-i18n="mod">改图</span><div class="zoom"><div class="fit"><img alt=""><div class="marks"></div></div></div></div>
  </div>
</section>

<!-- collection -->
<section id="scr-col" class="screen">
  <button class="langswitch" id="langswitch-col">🌐</button>
  <h2 data-i18n="collection">卡片图鉴</h2>
  <p id="colprog"></p>
  <div id="colgrid"></div>
  <button class="subbtn" id="btn-colback" style="margin:16px auto 0" data-i18n="back">返回</button>
</section>

<!-- clear overlay -->
<div class="overlay" id="clearov"><div class="card">
  <div class="big" id="clear-title"></div>
  <p class="dim" id="clear-bonus" style="margin-top:8px"></p>
</div></div>

<!-- quiz overlay -->
<div class="overlay" id="quizov"><div class="card">
  <h2 data-i18n="quiztitle">答题关</h2>
  <p id="quiz-q" style="font-size:16.5px;line-height:1.55"></p>
  <div class="qopts" id="quiz-opts"></div>
  <p class="dim" id="quiz-note" style="margin-top:10px"></p>
</div></div>

<!-- settlement -->
<div class="overlay" id="settle"><div class="card">
  <h2 data-i18n="gameover">局终结算</h2>
  <div class="bignum">
    <div><div class="n" id="set-level">0</div><div class="l" data-i18n="reach">到达关卡</div></div>
    <div><div class="n" id="set-score">0</div><div class="l" data-i18n="score">总分</div></div>
  </div>
  <div class="gacha" id="gacha"><div class="gachainner">
    <div class="gface gback">🎴</div>
    <div class="gface gfront"><img id="gacha-img" alt=""><div class="rframe" id="gacha-frame"></div></div>
  </div></div>
  <p class="glabel" id="gacha-label"></p>
  <div class="setbtns">
    <button id="btn-share" data-i18n="share">𝕏 晒成绩</button>
    <button id="btn-share-card" data-i18n="sharec">📷 带卡分享</button>
    <button id="btn-again" data-i18n="again">再来一局</button>
    <button id="btn-tocol" data-i18n="tocol">看图鉴</button>
  </div>
  <p id="fromline"></p>
</div></div>

<div class="overlay" id="magov"><div class="card" style="padding:12px">
  <div class="magview" id="magA"></div>
  <div class="magview" id="magB" style="margin-top:8px"></div>
  <button class="subbtn" id="mag-close" style="margin-top:12px"></button>
</div></div>

<div class="overlay" id="installov"><div class="card">
  <h2 data-i18n="install">📲 装到主屏幕</h2>
  <div id="install-steps"></div>
  <div id="install-arrow">⬇</div>
  <button class="subbtn" id="install-close" style="margin-top:12px" data-i18n="gotit">知道了</button>
</div></div>

<div id="toast"></div>

<script>
"use strict";
/* ============ i18n ============ */

let deferredPrompt = null;

function stepRow(ic, tx){ return '<div class="step"><div class="ic">' + ic + '</div><div class="tx">' + tx + '</div></div>'; }

  if (deferredPrompt && !IS_INAPP) {
    deferredPrompt.prompt();

    deferredPrompt = null;
    if (choice && choice.outcome === 'accepted') updateInstallVisibility();
    return;
  }
  const box = $('install-steps');
  if (IS_INAPP) {
    box.innerHTML = stepRow('🧭', t(IS_IOS ? 'inapp_ios' : 'inapp_and')) + stepRow('📲', t('gstep_done'));

  } else {
    box.innerHTML = stepRow('⋮', t('gstep_menu')) + stepRow('➕', t('gstep_add_and')) + stepRow('🎮', t('gstep_done'));
    $('install-arrow').style.display = 'none';
  }
  $('installov').classList.add('show');
});
$('install-close').addEventListener('click', () => $('installov').classList.remove('show'));

/* ============ levels ============ */
function levelFor(n){
  if (n <= LEVELS.length) return LEVELS[n - 1];
  const pool = [5, 6, 7, 8];
  const lv = LEVELS[pool[(n - LEVELS.length - 1) % pool.length]];
  return Object.assign({}, lv, {time: Math.max(25, 59 - 2 * (n - LEVELS.length))});
}
function layoutFit(){
  if (!curLevel) return;
  document.querySelectorAll('.stage').forEach(st => {
    const fit = st.querySelector('.fit');
    const W = st.clientWidth, H = st.clientHeight;
    const sc = Math.max(W / curLevel.w, H / curLevel.h);
    const fw = curLevel.w * sc, fh = curLevel.h * sc;
    fit.style.width = fw + 'px'; fit.style.height = fh + 'px';
    fit.style.left = (W - fw) / 2 + 'px'; fit.style.top = (H - fh) / 2 + 'px';
    fit.querySelectorAll('.mark').forEach(m => { const s = Math.max(26, fw * 0.115); m.style.width = s + 'px'; m.style.height = s + 'px'; });
  });
}

function startLevel(n){
  levelNo = n; curLevel = levelFor(n);
  foundSet = new Set(); misses = 0;
  timeMax = curLevel.time; timeLeft = curLevel.time;
  if (!runWorks.some(w => w.key === curLevel.key)) runWorks.push(curLevel);
  document.querySelectorAll('.stage').forEach((st, i) => {
    st.querySelector('img').src = i === 0 ? curLevel.a : curLevel.b;
    st.querySelector('.marks').innerHTML = '';
  });
  mode = 'playing';
  show('scr-game');
  requestAnimationFrame(() => { layoutFit(); updateHud(); });
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (mode !== 'playing') return;
    timeLeft = Math.max(0, timeLeft - 0.1);
    updateHud();
    if (timeLeft <= 0) gameOver();
  }, 100);
}
function updateHud(){
  if (!curLevel) return;
  $('hud-lv').textContent = t('level', {n: levelNo});
  $('hud-found').textContent = t('found', {a: foundSet.size, b: curLevel.diffs.length});
  $('hud-score').textContent = t('score', {s: score});
  const tot = Math.ceil(timeLeft), m = Math.floor(tot / 60), s = tot % 60;
  $('timetext').textContent = m + ':' + String(s).padStart(2, '0');
  const bar = $('timebar');
  bar.style.width = (timeLeft / timeMax * 100) + '%';
  bar.classList.toggle('low', timeLeft <= 10);
  $('prop-hint').innerHTML = t('hint') + ' <b>×' + props.hint + '</b>';
  $('prop-time').innerHTML = t('time') + ' <b>×' + props.time + '</b>';
  $('prop-expose').innerHTML = t('expose') + ' <b>×' + props.expose + '</b>';
  $('prop-mag').innerHTML = t('mag') + ' <b>×' + props.mag + '</b>';
  $('prop-mag').classList.toggle('armed', magArm);
  $('prop-hint').disabled = props.hint <= 0;
  $('prop-time').disabled = props.time <= 0;
  $('prop-expose').disabled = props.expose <= 0;
  $('prop-mag').disabled = props.mag <= 0 && !magArm;
}
function addMark(idx, cls){
  const [x, y] = curLevel.diffs[idx];
  document.querySelectorAll('.stage .marks').forEach(mk => {
    const d = document.createElement('div');
    d.className = 'mark ' + (cls || '');
    d.style.left = x * 100 + '%'; d.style.top = y * 100 + '%';
    mk.appendChild(d);
  });
  layoutFit();
}
function missAt(stageEl, rx, ry){
  misses++; score = Math.max(0, score - 20); timeLeft = Math.max(0, timeLeft - 3);
  stageEl.classList.remove('shake'); void stageEl.offsetWidth; stageEl.classList.add('shake');
  const fit = stageEl.querySelector('.fit');
  const x = document.createElement('div'); x.className = 'missx'; x.textContent = '✕';
  x.style.left = rx * 100 + '%'; x.style.top = ry * 100 + '%';
  fit.appendChild(x); setTimeout(() => x.remove(), 600);
  updateHud();
  if (timeLeft <= 0) gameOver();
}
function hitTest(rx, ry){
  let bestIdx = -1, bestD = 1e9;
  curLevel.diffs.forEach((d, i) => {
    if (foundSet.has(i)) return;
    const dist = Math.hypot((rx - d[0]) * curLevel.w, (ry - d[1]) * curLevel.h);
    if (dist < bestD) { bestD = dist; bestIdx = i; }
  });
  return bestD <= curLevel.w * 0.065 ? bestIdx : -1;
}
function onTap(stageEl, rx, ry){
  if (mode !== 'playing') return;
  if (magArm) { magArm = false; props.mag--; openMag(rx, ry); updateHud(); return; }
  const idx = hitTest(rx, ry);
  if (idx >= 0) {
    foundSet.add(idx); score += 100; addMark(idx, '');
    updateHud();
    if (foundSet.size === curLevel.diffs.length) levelClear();
  } else missAt(stageEl, rx, ry);
}
function levelClear(){
  mode = 'clear';
  const bonus = Math.ceil(timeLeft) * 2; score += bonus;
  const perfect = misses === 0;
  $('clear-title').textContent = t('clear');
  $('clear-bonus').textContent = t('bonus', {p: bonus}) + (perfect ? ' · ' + t('perfect') : '');
  $('clearov').classList.add('show');
  let dropped = null;
  if (perfect && Math.random() < 0.2) dropped = grantProp();
  setTimeout(() => {
    $('clearov').classList.remove('show');
    if (dropped) toast(t('drop', {p: propName(dropped)}), 2200);
    if (levelNo % 5 === 0) openQuiz();
    else startLevel(levelNo + 1);
  }, 1300);
}
function grantProp(){
  const r = Math.random();
  const k = r < 4/9 ? 'hint' : r < 6/9 ? 'time' : r < 8/9 ? 'mag' : 'expose';
  props[k]++; return k;
}
function propName(k){ return k === 'hint' ? t('hint') : k === 'time' ? t('time') : k === 'mag' ? t('mag') : t('expose'); }

/* ============ props ============ */
function unfound(){ return curLevel.diffs.map((d, i) => i).filter(i => !foundSet.has(i)); }
$('prop-hint').addEventListener('click', () => {
  if (mode !== 'playing' || props.hint <= 0) return;
  props.hint--;
  const u = unfound(); if (!u.length) return;
  const idx = u[Math.floor(Math.random() * u.length)];
  const [x, y] = curLevel.diffs[idx];
  document.querySelectorAll('.stage .marks').forEach(mk => {
    const d = document.createElement('div');
    d.className = 'mark hintring';
    d.style.left = x * 100 + '%'; d.style.top = y * 100 + '%';
    mk.appendChild(d); setTimeout(() => d.remove(), 2600);
  });
  layoutFit(); toast(t('hintused')); updateHud();
});
$('prop-time').addEventListener('click', () => {
  if (mode !== 'playing' || props.time <= 0) return;
  props.time--; timeLeft += 10; toast(t('timeused')); updateHud();
});
$('prop-expose').addEventListener('click', () => {
  if (mode !== 'playing' || props.expose <= 0) return;
  const u = unfound(); if (!u.length) return;
  props.expose--;
  const idx = u[Math.floor(Math.random() * u.length)];
  foundSet.add(idx); score += 50; addMark(idx, 'exposed');
  toast(t('exposeused')); updateHud();
  if (foundSet.size === curLevel.diffs.length) levelClear();
});

/* ============ magnifier ============ */
function openMag(rx, ry){
  const Z = 3;
  $('mag-close').textContent = t('close');
  $('magov').classList.add('show');
  requestAnimationFrame(() => {
  [['magA', curLevel.a], ['magB', curLevel.b]].forEach(([id, srcUrl]) => {
    const el = $(id);
    const pw = el.clientWidth || Math.min(window.innerWidth * 0.92, 394), ph = el.clientHeight || window.innerHeight * 0.32;
    const bgW = pw * Z, bgH = bgW * curLevel.h / curLevel.w;
    let bx = -(rx * bgW - pw / 2), by = -(ry * bgH - ph / 2);
    bx = Math.min(0, Math.max(-(bgW - pw), bx)); by = Math.min(0, Math.max(-(bgH - ph), by));
    el.style.backgroundImage = 'url(' + srcUrl + ')';
    el.style.backgroundSize = bgW + 'px ' + bgH + 'px';
    el.style.backgroundPosition = bx + 'px ' + by + 'px';
  });
  });
}
$('mag-close').addEventListener('click', () => $('magov').classList.remove('show'));
$('prop-mag').addEventListener('click', () => {
  if (mode !== 'playing') return;
  if (magArm) { magArm = false; updateHud(); return; }
  if (props.mag <= 0) return;
  magArm = true; toast(t('magarm')); updateHud();
});

/* ============ quiz ============ */
function openQuiz(){
  mode = 'quiz';
  const q = QUIZ[Math.floor(Math.random() * QUIZ.length)];
  $('quiz-q').textContent = q.q[lang];
  $('quiz-note').textContent = t('quiznote');
  const box = $('quiz-opts'); box.innerHTML = '';
  const order = q.o[lang].map((txt, i) => ({txt, ok: i === q.a})).sort(() => Math.random() - 0.5);
  order.forEach(o => {
    const b = document.createElement('button'); b.textContent = o.txt;
    b.addEventListener('click', () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      b.classList.add(o.ok ? 'right' : 'wrong');
      if (o.ok) { const k = grantProp(); toast(t('correct') + ' ' + t('drop', {p: propName(k)}), 2300); }
      else toast(t('wrong'), 1800);
      setTimeout(() => { $('quizov').classList.remove('show'); startLevel(levelNo + 1); }, 1500);
    });
    box.appendChild(b);
  });
  $('quizov').classList.add('show');
}

/* ============ game over / gacha ============ */
function rollRarity(s){
  const tbl = s < 1000 ? {N:70, R:24, SR:5, SSR:1} : s < 3000 ? {N:60, R:30, SR:7, SSR:3} : s < 6000 ? {N:50, R:34, SR:10, SSR:6} : {N:40, R:36, SR:14, SSR:10};
  let r = Math.random() * 100;
  for (const k of ['SSR', 'SR', 'R', 'N']) { if (r < tbl[k]) return k; r -= tbl[k]; }
  return 'N';
}
function gameOver(){
  if (mode === 'over') return;
  mode = 'over'; clearInterval(timerId);
  toast(t('timeup'), 1500);
  const b = best();
  if (!b || score > b.score) localStorage.setItem('fg_best', JSON.stringify({level: levelNo, score}));
  $('set-level').textContent = levelNo;
  $('set-score').textContent = score;
  const rar = rollRarity(score);
  let pool = CARDS.filter(c => c.r === rar);
  if (!pool.length) pool = CARDS.filter(c => c.r === 'N');
  drawnCard = pool[Math.floor(Math.random() * pool.length)];
  $('gacha-img').src = drawnCard.img;
  $('gacha-frame').className = 'rframe rar-' + drawnCard.r;
  $('gacha-label').textContent = t('tapcard');
  $('gacha').classList.remove('flipped');
  const from = [...new Set(runWorks.map(w => w.title[lang]))].join(' · ');
  $('fromline').textContent = t('from', {t: from});
  setTimeout(() => $('settle').classList.add('show'), 650);
}
$('gacha').addEventListener('click', () => {
  if (!drawnCard || $('gacha').classList.contains('flipped')) return;
  $('gacha').classList.add('flipped');
  let col = {}; try { col = JSON.parse(localStorage.getItem('fg_cards') || '{}'); } catch(e){}
  const isNew = !col[drawnCard.id];
  col[drawnCard.id] = (col[drawnCard.id] || 0) + 1;
  localStorage.setItem('fg_cards', JSON.stringify(col));
  $('gacha-label').innerHTML = '<span class="r" style="color:var(--gold)">' + drawnCard.r + '</span> ' +
    drawnCard.name[lang] + '《' + drawnCard.work[lang] + '》<br>' +
    (isNew ? t('newcard') : t('owned', {n: col[drawnCard.id]}));
});
const GATE_HASH = '80253ab95a9cf1ca79623b252c72cf529aaa60e898b6487dedf61cc03029ab34';
async function sha256hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
if (localStorage.getItem('fg_gate') === GATE_HASH) $('gate').style.display = 'none';
async function tryGate() {
  const v = $('gate-in').value.trim();
  if (!v) return;
  if (await sha256hex(v) === GATE_HASH) {
    localStorage.setItem('fg_gate', GATE_HASH);
    $('gate').style.display = 'none';
  } else {
    $('gate-err').textContent = '口令不对 · Wrong passcode · パスコードが違います';
  }
}
$('gate-btn').addEventListener('click', tryGate);
$('gate-in').addEventListener('keydown', e => { if (e.key === 'Enter') tryGate(); });
function buildShareImage(txt) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1350;
        const g = cv.getContext('2d');
        const grad = g.createLinearGradient(0, 0, 0, 1350);
        grad.addColorStop(0, '#182747'); grad.addColorStop(1, '#0b1322');
        g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
        g.textAlign = 'center'; g.fillStyle = '#eef3ff';
        g.font = '700 62px sans-serif';
        g.fillText(t('title'), 540, 118);
        const RC = {SSR: '#ffd34d', SR: '#c07dff', R: '#57b6ff', N: '#9aa7bd'};
        const x0 = 160, y0 = 168, sz = 760;
        g.drawImage(img, x0, y0, sz, sz);
        g.lineWidth = 16; g.strokeStyle = RC[drawnCard.r] || '#9aa7bd';
        g.strokeRect(x0 - 8, y0 - 8, sz + 16, sz + 16);
        g.beginPath(); g.arc(x0 + sz - 6, y0 + 6, 58, 0, Math.PI * 2);
        g.fillStyle = RC[drawnCard.r] || '#9aa7bd'; g.fill();
        g.fillStyle = '#101a2e'; g.font = '800 44px sans-serif';
        g.fillText(drawnCard.r, x0 + sz - 6, y0 + 22);
        g.fillStyle = '#eef3ff'; g.font = '700 56px sans-serif';
        g.fillText(drawnCard.name[lang], 540, 1032);
        g.fillStyle = '#aebadd'; g.font = '44px sans-serif';
        g.fillText('《' + drawnCard.work[lang] + '》', 540, 1104);
        g.fillStyle = '#ffd34d'; g.font = '700 46px sans-serif';
        g.fillText(txt, 540, 1216);
        g.fillStyle = '#7f8db0'; g.font = '36px sans-serif';
        g.fillText(location.origin + location.pathname, 540, 1296);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/png');
      } catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = drawnCard.img;
  });
}
$('btn-share').addEventListener('click', () => {
  let txt = t('sharetext', {l: levelNo, s: score});
  if (drawnCard && (drawnCard.r === 'SR' || drawnCard.r === 'SSR'))
    txt += t('sharecard', {r: drawnCard.r, c: drawnCard.name[lang]});
  txt += ' ' + location.origin + location.pathname;
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(txt), '_blank');
});
$('btn-share-card').addEventListener('click', async () => {
  if (!drawnCard) { toast(t('noitem')); return; }
  let txt = t('sharetext', {l: levelNo, s: score});
  if (drawnCard.r === 'SR' || drawnCard.r === 'SSR')
    txt += t('sharecard', {r: drawnCard.r, c: drawnCard.name[lang]});
  const url = location.origin + location.pathname;
  try {
    const blob = await buildShareImage(txt);
    const file = new File([blob], 'findai-score.png', {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file], text: txt + ' ' + url}); } catch (e) { /* user cancelled */ }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'findai-score.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(t('shareimg'));
  } catch (e) { toast(t('checkfail')); }
});
$('btn-again').addEventListener('click', () => { $('settle').classList.remove('show'); startRun(); });
$('btn-tocol').addEventListener('click', () => { $('settle').classList.remove('show'); renderCollection(); show('scr-col'); });

/* ============ collection ============ */
function renderCollection(){
  let col = {}; try { col = JSON.parse(localStorage.getItem('fg_cards') || '{}'); } catch(e){}
  const owned = CARDS.filter(c => col[c.id]).length;
  $('colprog').textContent = t('colprog', {a: owned, b: CARDS.length});
  const grid = $('colgrid'); grid.innerHTML = '';
  const rank = {SSR: 0, SR: 1, R: 2, N: 3};
  [...CARDS].sort((a, b) => rank[a.r] - rank[b.r]).forEach(c => {
    const n = col[c.id] || 0;
    const d = document.createElement('div');
    d.className = 'colitem' + (n ? '' : ' unowned');
    d.style.borderColor = c.r === 'SSR' ? '#ffd94d' : c.r === 'SR' ? '#b388ff' : c.r === 'R' ? '#4dd0e1' : '#2c4472';
    d.innerHTML = '<img src="' + c.img + '" alt="">' +
      '<div class="nm">' + (n ? c.name[lang] + '《' + c.work[lang] + '》' : '???') + (n > 1 ? ' <span class="cnt">×' + n + '</span>' : '') + '</div>' +
      '<div class="rr" style="color:' + (c.r === 'SSR' ? '#ffd94d' : c.r === 'SR' ? '#b388ff' : c.r === 'R' ? '#4dd0e1' : '#9fb0d8') + '">' + c.r + '</div>';
    grid.appendChild(d);
  });
}
$('btn-col').addEventListener('click', () => { renderCollection(); show('scr-col'); });
$('btn-colback').addEventListener('click', () => show('scr-home'));

/* ============ run control ============ */
function startRun(){
  if (!LEVELS.length) { toast('Loading…'); return; }
  score = 0; props = {hint: 1, time: 1, expose: 1, mag: 1}; runWorks = [];
  startLevel(1);
}
$('btn-start').addEventListener('click', startRun);

/* ============ gestures: tap only — free pinch zoom is disabled by design;
   magnification is the magnifier item's job (star 2026-11-17) ============ */
document.addEventListener('gesturestart', e => { e.preventDefault(); });
document.addEventListener('dblclick', e => { e.preventDefault(); }, {passive: false});
document.querySelectorAll('.stage').forEach(stageEl => {
  const pointers = new Map();
  let downAt = 0, downPos = null, moved = false, multi = false;
  stageEl.addEventListener('pointerdown', e => {
    stageEl.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pointers.size === 1) { downAt = Date.now(); downPos = {x: e.clientX, y: e.clientY}; moved = false; multi = false; }
    if (pointers.size >= 2) { multi = true; moved = true; }
  });
  stageEl.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId) || !downPos) return;
    if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 9) moved = true;
  });
  const endPointer = e => {
    const wasTap = pointers.size === 1 && !moved && !multi && Date.now() - downAt < 450;
    pointers.delete(e.pointerId);
    if (wasTap && mode === 'playing') {
      const fit = stageEl.querySelector('.fit').getBoundingClientRect();
      const rx = (e.clientX - fit.left) / fit.width, ry = (e.clientY - fit.top) / fit.height;
      if (rx >= 0 && rx <= 1 && ry >= 0 && ry <= 1) onTap(stageEl, rx, ry);
    }
  };
  stageEl.addEventListener('pointerup', endPointer);
  stageEl.addEventListener('pointercancel', endPointer);
});
window.addEventListener('resize', layoutFit);

/* ============ version + manual update ============ */
const APP_VERSION = 'v0.7';
$('ver').textContent = APP_VERSION;
$('btn-update').addEventListener('click', async () => {
  toast(t('checking'), 1400);
  try {
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
    const res = await fetch(location.pathname, {cache: 'no-store'});
    const html = await res.text();
    const m = html.match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION) { toast(t('updating'), 1600); setTimeout(() => location.reload(), 900); return; }
    toast(t('uptodate', {v: APP_VERSION}), 2200);
  } catch(e) { toast(t('checkfail'), 2200); }
});

/* ============ boot ============ */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (lang && STR[lang]) { setLang(lang); } else { show('scr-lang'); }
renderBest();
</script>
